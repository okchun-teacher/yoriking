:root{--ink:#3a2430;--pink:#ff6fae;--yellow:#ffe066}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1b1238;overflow:hidden;font-family:'Galmuri',sans-serif;color:var(--ink);font-size:12px}
button{font-family:inherit;color:inherit;cursor:pointer}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:#1b1238}
#game{position:absolute;left:0;top:0;width:936px;height:720px;image-rendering:pixelated;touch-action:none;outline:none}
.hidden{display:none!important}
#panel{position:absolute;left:936px;top:0;width:344px;height:720px;overflow:hidden;border-left:6px solid #e57aa0;background:#2b1a5e}
#pileCv{position:absolute;left:0;top:0;width:338px;height:720px;image-rendering:pixelated}
#pnl{position:absolute;inset:0;padding:8px 12px}
.logo{font-size:44px;color:var(--pink);line-height:1;letter-spacing:1px;
  text-shadow:3px 0 #5a1840,-3px 0 #5a1840,0 3px #5a1840,0 -3px #5a1840,3px 3px #5a1840,-3px -3px #5a1840,3px -3px #5a1840,-3px 3px #5a1840,0 7px 0 #1b0f30}
.logo small{display:inline-block;font-size:12px;background:#fff;color:var(--pink);border:3px solid #5a1840;padding:2px 6px;text-shadow:none;vertical-align:top;transform:rotate(-6deg);margin-left:4px}
#clockRow{display:flex;gap:6px;align-items:center;margin:10px 0 6px}
.pill{background:#fff7b0;border:3px solid var(--ink);box-shadow:inset -3px -3px 0 #f0c040;padding:3px 8px;font-size:18px;white-space:nowrap}
.ibtn{height:34px;min-width:44px;border:3px solid var(--ink);background:#ffd0e4;box-shadow:inset -3px -3px 0 #ff9fbf,0 3px 0 var(--ink);font-size:12px;padding:0 6px}
.hg{height:12px;border:3px solid #fff;background:#1b0f30}
.hg>div{height:100%;background:linear-gradient(90deg,#ffe066,#ff9f40)}
.ctrs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.ctr{display:flex;align-items:center;gap:5px;background:#1d1150;border:3px solid #6a5ad0;border-radius:12px;padding:2px 8px;color:#fff;font-size:18px;height:36px}
.ctr img{width:24px;height:24px;image-rendering:pixelated}
.ctr .lb{font-size:12px;color:#b8a8ff;margin-left:auto}
.ebar{width:56px;height:10px;border:2px solid #fff;background:#1b0f30;margin-left:auto}
.ebar>div{height:100%;background:#9be58a}
#meters{background:#fff7fb;border:3px solid var(--ink);box-shadow:inset -3px -3px 0 #ffc0d6;padding:4px 8px;margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
#meters .mb{height:8px;border:2px solid var(--ink);background:#eee;margin-top:1px}
#meters .mb>div{height:100%}
.sec{color:#ffe066;font-size:12px;margin:7px 0 3px;display:flex;justify-content:space-between}
.sec small{color:#b8a8ff}
#tix{display:grid;grid-template-columns:1fr 1fr;gap:4px;min-height:36px}
.tk{display:flex;align-items:center;gap:3px;background:#fffbe8;border:3px solid var(--ink);padding:1px 4px;height:34px;cursor:pointer;font-size:12px;line-height:1.1;overflow:hidden}
.tk img{width:28px;height:28px;image-rendering:pixelated;flex:none}
.tk .num{background:var(--ink);color:#fff;padding:0 3px;flex:none}
.tk .tb{color:#a0602a;margin-left:auto;flex:none}
.tk.cook{background:#ffe066}
.tk.empty{background:transparent;border-style:dashed;border-color:#6a5ad0;color:#8a7ad8;cursor:default;justify-content:center}
#card{background:#fffbe8;border:3px solid var(--ink);box-shadow:inset -3px -3px 0 #f0d890;padding:4px 8px;margin-top:5px;min-height:96px;font-size:12px;line-height:1.4}
#card .ttl{font-size:18px;display:flex;align-items:center;gap:6px;margin-bottom:2px}
#card .ttl img{width:32px;height:32px;image-rendering:pixelated}
.stp{display:block;padding:0 4px}
.stp.done{color:#9a9a9a;text-decoration:line-through}
.stp.cur{background:#ffe066;outline:2px solid var(--ink)}
.stp.warn{background:#ffd0d0;color:#c02838}
#note{position:absolute;left:12px;right:12px;bottom:70px;height:35px;overflow:hidden;color:#bfe8ff;font-size:12px;line-height:1.45;background:#241452;z-index:2}
#note .nw{background:#ff6fae;color:#fff;padding:0 4px;margin-right:4px}
#keys{position:absolute;left:12px;right:12px;bottom:8px;color:#fff;font-size:12px;line-height:1.6;white-space:nowrap;overflow:hidden;background:rgba(27,15,48,.75);border:2px solid #6a5ad0;padding:4px 8px}
#keys b{background:#fff;color:var(--ink);padding:0 4px;margin:0 1px}
#toasts{position:absolute;left:470px;width:316px;bottom:10px;z-index:60!important;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;pointer-events:none;z-index:15}
.toast{background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:4px 10px;font-size:12px;text-align:center;line-height:1.4;animation:tin .15s,tout .4s 2.6s forwards}
.toast.good{background:#d8ffcc}.toast.bad{background:#ffd6dc}.toast.tip{background:#d6efff}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
@keyframes tout{to{opacity:0}}
.win{background:#fff7fb;border:4px solid var(--ink);box-shadow:inset -4px -4px 0 #ffc0d6,inset 4px 4px 0 #fff,0 6px 0 rgba(0,0,0,.35)}
.wtitle{background:var(--pink);color:#fff;font-size:18px;padding:4px 10px;display:flex;align-items:center;gap:8px;border-bottom:4px solid var(--ink);text-shadow:2px 2px 0 #a03060}
.wtitle img{height:32px;width:auto;image-rendering:pixelated}
.wtitle .later{margin-left:auto;border:3px solid var(--ink);background:#fff;font-size:12px;padding:2px 8px;text-shadow:none;color:var(--ink)}
#mg{position:absolute;left:108px;width:720px;z-index:30}
#mg.std{top:500px}
#mg.tall{top:420px}
.mgb{padding:6px 14px 10px;display:flex;flex-direction:column;align-items:center}
.mgtip{color:#2a6ad0;font-size:12px;margin:2px 0 6px;text-align:center}
.blocks{display:flex;gap:3px;margin:2px 0 8px;flex-wrap:wrap;justify-content:center;max-width:680px}
.blocks i{width:22px;height:14px;border:2px solid var(--ink);background:#eee;display:block}
.blocks i.on{background:#5ac85a}
.tapRow{display:flex;align-items:center;gap:18px}
.tapRow img{width:72px;height:auto;image-rendering:pixelated}
.tapRow img.bump{animation:bump .12s}
@keyframes bump{50%{transform:scale(1.15) rotate(-6deg)}}
.pbtn{border:3px solid var(--ink);background:var(--yellow);box-shadow:inset -4px -4px 0 #e0a800,inset 4px 4px 0 #fff4b0,0 4px 0 var(--ink);font-size:24px;padding:12px 26px;touch-action:manipulation}
.pbtn:active,.pbtn.hit{transform:translateY(3px);box-shadow:inset -4px -4px 0 #e0a800,inset 4px 4px 0 #fff4b0,0 1px 0 var(--ink)}

  const d=x.getImageData(0,0,c.width,c.height); let n=0;
  for(let i=0;i<d.data.length;i+=4){ if(d.data[i+3]<10) continue; const r=d.data[i],g=d.data[i+1],b=d.data[i+2]; if(r<80&&g<60&&b<70) continue;

  x.putImageData(d,0,0); return BADC[k]=c;
}

const feet=(x,y)=>({x:x-5,y:y-4,w:10,h:4});
const blocked=(x,y,ob)=>ob.some(r=>hitR(feet(x,y),r));
const GS=4, GW=MW/GS|0, GH=MH/GS|0;
function buildGrid(){ const ob=obstacles(); R.ob=ob; R.grid=new Uint8Array(GW*GH); for(let j=0;j<GH;j++) for(let i=0;i<GW;i++) R.grid[j*GW+i]=blocked(i*GS+2,j*GS+2,ob)?0:1; }
function findPath(tx,ty,zone){
  const me=R.me, si=clamp(me.x/GS|0,0,GW-1), sj=clamp(me.y/GS|0,0,GH-1);
  const goal=(i,j)=>zone?inR({x:i*GS+2,y:j*GS+2},zone):(Math.abs(i*GS+2-tx)<=GS&&Math.abs(j*GS+2-ty)<=GS);
  const prev=new Int32Array(GW*GH).fill(-2); const q=[sj*GW+si]; prev[q[0]]=-1; let found=-1;
  for(let h=0;h<q.length;h++){ const n=q[h], i=n%GW, j=n/GW|0; if(goal(i,j)&&R.grid[n]){ found=n; break; }
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){ const a=i+di,b=j+dj; if(a<0||b<0||a>=GW||b>=GH) continue; const m=b*GW+a; if(prev[m]!==-2||!R.grid[m]) continue; prev[m]=n; q.push(m); } }
  if(found<0) return null;
  const pts=[]; for(let n=found;n>=0;n=prev[n]) pts.unshift({x:(n%GW)*GS+2,y:(n/GW|0)*GS+2}); pts.shift();
  const out=[]; for(let k=0;k<pts.length;k++){ const a=out[out.length-1], b=pts[k+1]; if(a&&b&&((a.x===pts[k].x&&pts[k].x===b.x)||(a.y===pts[k].y&&pts[k].y===b.y))) continue; out.push(pts[k]); }
  return out;
}
function updateHero(dt){
  const me=R.me; let vx=0, vy=0;
  if(!R.mg){ if(KEYS.ArrowLeft||KEYS.KeyA) vx-=1; if(KEYS.ArrowRight||KEYS.KeyD) vx+=1; if(KEYS.ArrowUp||KEYS.KeyW) vy-=1; if(KEYS.ArrowDown||KEYS.KeyS) vy+=1; }
  const sp=heroSpeed()*dashMul();
  if(vx||vy){ me.path=null; me.then=null; const l=Math.hypot(vx,vy); vx/=l; vy/=l; }
  else if(me.path&&me.path.length){ const p=me.path[0], dx=p.x-me.x, dy=p.y-me.y, d=Math.hypot(dx,dy);
    if(d<1.5){ me.path.shift(); me.stuck=0; if(!me.path.length){ me.path=null; const f=me.then; me.then=null; if(f) f(); } } else { vx=dx/d; vy=dy/d; } }
  else if(me.path&&!me.path.length){ me.path=null; const f=me.then; me.then=null; if(f) f(); }
  me.moving=!!(vx||vy);
  if(me.moving){ if(Math.abs(vx)>Math.abs(vy)) me.dir=vx<0?'left':'right'; else me.dir=vy<0?'up':'down';
    const nx=me.x+vx*sp*dt, ny=me.y+vy*sp*dt;
    const ox=me.x, oy=me.y;
    if(!blocked(nx,me.y,R.ob)) me.x=nx; if(!blocked(me.x,ny,R.ob)) me.y=ny;
    if(me.path&&me.path.length&&ox===me.x&&oy===me.y){ me.stuck=(me.stuck||0)+dt; if(me.stuck>0.25){ me.x=me.path[0].x; me.y=me.path[0].y; me.stuck=0; } }
    me.anim+=dt; }
}

    if(!reached){ if(!c.path.length||c.path[c.path.length-1].x!==sx){ c.path=(Math.abs(c.y-QROW)>0.6?[{x:c.x,y:QROW}]:[]).concat([{x:sx,y:QROW}]); } }
    else if(i===0&&c.state==='queue'&&!c.path.length){ c.state='order'; c.pat=c.patMax; } });
  for(const c of R.customers.slice()){
    if(c.state!=='bye'&&c.op<1) c.op=Math.min(1,c.op+dt*3);
    c.moving=false;
    if(c.path.length){ const p=c.path[0], dx=p.x-c.x, dy=p.y-c.y, st=46*dt;
      // 축 방향으로만 이동 (정해진 길 따라)
      if(Math.abs(dx)>0.01){ c.x+=Math.sign(dx)*Math.min(st,Math.abs(dx)); c.moving=true; }
      else if(Math.abs(dy)>0.01){ c.y+=Math.sign(dy)*Math.min(st,Math.abs(dy)); c.moving=true; }
      if(Math.abs(p.x-c.x)<0.01&&Math.abs(p.y-c.y)<0.01){ c.x=p.x; c.y=p.y; c.path.shift(); if(!c.path.length) arrive(c); } }
    c.anim+=dt;
    const drain={queue:0.5,order:1,toSink:1,washing:1,toTable:1,wait:1,noSoap:1.5,quizWait:1,toWater:1,selfWater:1}[c.state];
    if(drain&&!c.tut) c.pat-=dt*drain;
    switch(c.state){
      case 'washing': c.washT-=dt; if(c.washT<=0) afterWash(c); break;
      case 'noSoap': if(R.soap>0){ R.soap--; c.state='washing'; c.washT=1.2; } break;
      case 'eat': c.eatT-=dt; if(Math.random()<dt*0.8) addPart('heart',c.x,c.y-22); if(c.eatT<=0) finishEat(c); break;
      case 'bye': c.y-=22*dt; c.op-=dt*0.5; if(c.op<=0){ removeCust(c); continue; } break;
    }
    xCustTick(c,dt); mannerTick(c,dt);
    if(c.state==='wait'||c.state==='eat'){
      if(c.waterIn!=null){ c.waterIn-=dt; if(c.waterIn<=0){ c.waterIn=null; c.water=18; SFX.pop(); } }
      if(c.water!=null){ c.water-=dt; if(c.water<=0){ c.water=null; c.waterFail++; toast('물을 못 받은 손님이 아쉬워해요…','bad'); } }
    }
    if(c.pat<=0&&drain){ c.kind==='quiz'?quizTimeout(c):angry(c); }
  }
}
function arrive(c){

function doStep(){
  const st=curStep();
  if(!R.apron){ toast('조리 전에 앞치마와 머릿수건을 착용해요! (반찬 냉장고 옆 앞치마 걸이)','bad'); learnTip(CONTENT.tips.prep); SFX.bad(); return; }
  if(needsClean(st)&&R.handH<50){ toast('손이 더러워요! 개수대에서 손부터 씻어요','bad'); learnTip(CONTENT.tips.handFirst); SFX.bad(); return; }
  if(st.type==='plate'){ if(R.clean<=0){ toast('깨끗한 접시가 없어요! 설거지해요','bad'); SFX.bad(); return; } if(R.ready.length>=4){ toast('완성대가 꽉 찼어요! 음식을 먼저 손님께 드려요','bad'); SFX.bad(); return; } }
  if(['boil','steam','fry','pan'].includes(st.type)) learnTip(CONTENT.tips.gas);
  if(st.type==='mix') return (/으깨|뭉쳐|말기|접기/.test(st.label)?openPress:openStir)(st);
  ({pick:openPick,cut:openCut,fry:openFry,boil:openHeat,steam:openHeat,pan:openHeat,micro:openMicro,wash:(s=>(/찬물|식혀/.test(s.label)?openCool:openWashTap)(s)),plate:openPlate}[st.type]||openTap)(st);
}
function completeStep(){
  const a=R.active, r=RECIPE(a.recipe), st=r.steps[a.step];
  a.prog=0; a.heat=0;
  if(st.type==='pick'){ S.money-=r.cost; R.stats.cost+=r.cost; }
  if(needsClean(st)) R.handH=Math.max(0,R.handH-6);
  if(st.type==='plate') R.clean--;
  learnTip(st.tip);
  if(st.raw){ R.handH=Math.min(R.handH,30); toast('날달걀을 만졌어요! 다음 재료를 만지기 전에 손을 씻어요','tip'); learnTip(CONTENT.tips.rawEgg); }
  a.step++;
  if(a.step>=r.steps.length){
    if(a.perfect){ R.stats.perfect++; S.tot.perfect++; }
    R.ready.push({no:a.ticket.no,recipe:r.id,perfect:a.perfect}); R.tickets=R.tickets.filter(k=>k!==a.ticket); R.active=null; R.kitchen=Math.max(0,R.kitchen-5);
    toast(`${r.name} 완성! 완성대에 올려 두었어요`,'good'); SFX.ok(); addPart('spark',245,216); emote('♪');
  } else SFX.pop();
  updCard(true); renderTix();
}

/* 칼질 : 칼이 점선에 올 때 Space */
const CUT_INFO={julienne:{n:6,name:'채썰기',how:'가늘고 길게 썰어요'},diagonal:{n:4,name:'어슷썰기',how:'비스듬하게 썰어요'},dice:{n:7,name:'잘게 썰기',how:'작게 송송 썰어요'}};
/* ----- 칼질 : 썰기 방법마다 다른 키 리듬 (방향키·WASD + Space) ----- */
const CUT_SEQ={julienne:[3,4],diagonal:[0,3,4],dice:[3,4,4]};
const CUT_HELP={julienne:'<b>←</b>(A)로 칼을 옮기고 <b>Space</b>로 썰기! 가늘고 길게',diagonal:'<b>↑</b>(W)로 칼을 비스듬히 세우고 <b>←</b>(A)로 옮긴 뒤 <b>Space</b>! 비스듬하게',dice:'<b>←</b>(A)로 옮기고 <b>Space Space</b> 톡톡! 작게 송송'};
function openCut(st){
  const style=CUT_INFO[st.style]?st.style:'dice', info=CUT_INFO[style], W=560, H=150, sc=9, iw=12*sc, ix=Math.round(W/2-iw/2)+30, iy=40, seq=CUT_SEQ[style];
  const cfg={kind:'cut',title:st.label,tip:CONTENT.tips.knife,icon:spriteURL(IC.knife,2,'knife'),st,style,info,W,H,sc,ix,iy,iw,lines:[],seq,pos:0,cur:0,
    kx:ix+iw+26,tx:ix+iw+26,tilt:0,miss:0,flash:0,chop:0,img:ingIcon(st),t:0};
  for(let i=info.n;i>=1;i--) cfg.lines.push({x:Math.round(ix+iw*i/(info.n+1)),cut:false});
  openMG(cfg,`<div class="mgsub"><b>${info.name}</b>: ${CUT_HELP[style]}</div>
    <div class="cutBar"><div class="cmdSeq" id="cutSeq"></div><div class="mgsub" id="mgInfo">왼손은 고양이 손!</div></div>${mgCanvas(W,H)}`,true);
  cfg.cv=$('#mgCv'); cfg.cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cutKey(cfg.seq[cfg.pos]); });
  cfg.tick=dt=>{ cfg.t+=dt; cfg.kx+=(cfg.tx-cfg.kx)*Math.min(1,dt*18); cfg.flash=Math.max(0,cfg.flash-dt); cfg.chop=Math.max(0,cfg.chop-dt); if(cfg.done){ cfg.done-=dt; if(cfg.done<=0){ closeMG(); completeStep(); return; } } cutDraw(cfg); };
  cutRender(cfg); cutDraw(cfg);
}
function cutRender(c){ const el=$('#cutSeq'); if(!el) return;
  el.innerHTML=c.seq.map((k,i)=>`<span class="ck ${i<c.pos?'ok':i===c.pos?'cur':''} ${k===4?'wide':''}">${CMD_KEYS[k][2]}</span>`).join('')+`<span class="cutCnt">${c.cur} / ${c.lines.length}</span>`; }
function lineX(c,l){ const cuts=c.lines.filter(v=>v.cut).map(v=>v.x); return l.x+cuts.filter(v=>v<l.x).length*5; }
function cutKey(k){
  const c=R&&R.mg; if(!c||c.kind!=='cut'||R.paused||c.done) return;
  if(k!==c.seq[c.pos]){ c.miss++; c.flash=0.3; SFX.bad(); const cur=document.querySelector('#cutSeq .ck.cur'); if(cur){ cur.classList.remove('shake'); void cur.offsetWidth; cur.classList.add('shake'); }
    $('#mgInfo').innerHTML='<b style="color:#c02838">삐끗!</b> 순서대로 천천히! 식품을 잡은 손가락은 안으로 구부려요.'; learnTip(CONTENT.tips.knife); return; }
  const line=c.lines[c.cur];
  if(k===0){ c.tilt=1; SFX.pop(); }
  else if(k===3){ c.tx=lineX(c,line); SFX.pop(); }
  else if(k===4){ c.chop=0.12; SFX.tap(); R.me.hop=0.1;
    const last=c.seq.lastIndexOf(4);
    if(c.pos===last){ line.cut=true; c.cur++; c.tilt=0; } }
  c.pos++;
  if(c.pos>=c.seq.length){ c.pos=0; if(c.cur>=c.lines.length){ c.done=0.45; if(c.miss===0){ R.active.perfect=true; toast(`${c.info.name} 완벽해요! (손님 만족 UP)`,'good'); } else toast(`${c.info.name} 완성!`,'good'); SFX.ok(); } }
  cutRender(c);
}
function cutHit(){ const c=R&&R.mg; if(c&&c.kind==='cut') cutKey(4); }
function cutDraw(c){
  const x=px2(c.cv); x.clearRect(0,0,c.W,c.H);
  x.fillStyle='#3a2430'; x.fillRect(20,28,c.W-40,c.H-36); x.fillStyle='#c97d5d'; x.fillRect(24,32,c.W-48,c.H-44); x.fillStyle='#a8604a'; x.fillRect(c.W-40,32,16,c.H-44); x.fillStyle='#e8c0b0'; x.fillRect(40,62,10,50); x.fillStyle='#3a2430'; x.fillRect(38,60,14,2); x.fillRect(38,112,14,2);
  blit(x,IC.hand,c.ix-62,c.iy+14,5);
  const cuts=c.lines.filter(l=>l.cut).map(l=>l.x).sort((a,b)=>a-b), edges=[c.ix,...cuts,c.ix+c.iw], diag=c.style==='diagonal';
  for(let i=0;i<edges.length-1;i++){ const a=edges[i], b=edges[i+1], off=i*5; x.save(); x.beginPath();
    if(diag){ const s=c.iw*0.35; x.moveTo(a+off,c.iy-8); x.lineTo(b+off,c.iy-8); x.lineTo(b+off+s,c.iy+c.iw+6); x.lineTo(a+off+s,c.iy+c.iw+6); x.closePath(); } else x.rect(a+off,0,b-a,c.H);
    x.clip(); blit(x,c.img,c.ix+off,c.iy,c.sc); x.restore(); }
  const next=c.lines[c.cur];
  c.lines.forEach(l=>{ if(l.cut) return; const lx=lineX(c,l), isN=l===next; x.fillStyle=isN?'#2e8a3e':'rgba(255,255,255,.7)';
    for(let y=c.iy-8;y<c.iy+c.iw+6;y+=8){ const sl=diag?(y-c.iy)*0.35:0; x.fillRect(lx+sl-1,y,isN?3:2,5); } });
  // 칼
  const ky=c.iy-46+(c.chop>0?16:0); x.save(); x.translate(Math.round(c.kx),ky+84); if(c.tilt) x.rotate(-0.33); x.scale(1,-1); blit(x,IC.knife,-20,0,4); x.restore();
  if(c.flash>0){ x.fillStyle='rgba(255,48,80,'+(c.flash*2)+')'; x.fillRect(0,0,c.W,c.H); }
  if(c.done){ const k=Math.floor(c.t*12)%2; x.fillStyle='#ffe066'; [[c.ix-14,c.iy],[c.ix+c.iw+30,c.iy+30],[c.ix+c.iw/2,c.iy-18]].forEach(([sx,sy],i)=>{ const r=(i+k)%2?8:5; x.fillRect(sx-r,sy,2*r+1,3); x.fillRect(sx,sy-r,3,2*r+1); }); }
}

function heatStop(){

  if(m.mode==='pan'&&m.phase===0){ m.phase=1; R.active.heat=0; SFX.pop(); toast('뒤집었어요! 한 번 더 알맞게 익혀요','good'); $('#mgStop').innerHTML=`${m.T.btn2} <kbd>Space</kbd>`; return; }

function pickConfirm(){ const m=R.mg; if(!m||m.kind!=='pick'||R.paused) return; const need=m.st.items;

/* ===================== 동작별 미니게임 2 ===================== */
function cvPos(cvs,e){ const r=cvs.getBoundingClientRect(); return {x:(e.clientX-r.left)*cvs.width/r.width, y:(e.clientY-r.top)*cvs.height/r.height}; }

/* 문질러 씻기 (재료 씻기 · 손 씻기 · 설거지) */
function scrubPanel(cfg){
  const W=520,H=176, img=cfg.img, sc=Math.max(3,Math.floor(Math.min(9,120/img.height,170/img.width))), iw=img.width*sc, ih=img.height*sc, ix=Math.round(W/2-iw/2), iy=Math.round(H/2-ih/2+12);
  const d=img.getContext('2d').getImageData(0,0,img.width,img.height).data, cand=[];
  for(let y=0;y<img.height;y++) for(let x=0;x<img.width;x++){ const i=(y*img.width+x)*4; if(d[i+3]>0&&!(d[i]<90&&d[i+1]<70&&d[i+2]<80)) cand.push([x,y]); }
  const spots=[]; for(const [px,py] of shuffle(cand)){ if(spots.length>=cfg.n) break; const sx=ix+(px+0.5)*sc, sy=iy+(py+0.5)*sc; if(spots.every(s=>Math.hypot(s.x-sx,s.y-sy)>34)) spots.push({x:sx,y:sy,hp:3}); }
  Object.assign(cfg,{kind:'scrub',W,H,ix,iy,sc,spots,cur:{x:70,y:H/2},bub:[],t:0});
  openMG(cfg,`<div class="mgsub">방향키(또는 마우스)로 수세미를 움직여 ${cfg.what||'얼룩'} 위에서 <kbd>Space</kbd>! (눌러도 돼요)</div>${mgCanvas(W,H)}<div class="mgsub" id="mgInfo">${cfg.verb||''}</div>`,true);
  cfg.cv=$('#mgCv');
  cfg.cv.addEventListener('pointermove',e=>{ const p=cvPos(cfg.cv,e); cfg.cur=p; });
  cfg.cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cfg.cur=cvPos(cfg.cv,e); scrubHit(); });
  cfg.tick=dt=>{ cfg.t+=dt; const sp=260*dt;
    if(KEYS.ArrowLeft||KEYS.KeyA) cfg.cur.x-=sp; if(KEYS.ArrowRight||KEYS.KeyD) cfg.cur.x+=sp; if(KEYS.ArrowUp||KEYS.KeyW) cfg.cur.y-=sp; if(KEYS.ArrowDown||KEYS.KeyS) cfg.cur.y+=sp;
    cfg.cur.x=clamp(cfg.cur.x,10,W-10); cfg.cur.y=clamp(cfg.cur.y,10,H-10);
    cfg.bub.forEach(b=>{ b.y-=40*dt; b.t+=dt; }); cfg.bub=cfg.bub.filter(b=>b.t<0.8); scrubDraw(cfg); };
  scrubDraw(cfg);
}
function scrubDraw(c){
  const x=px2(c.cv), W=c.W, H=c.H, t=c.t; x.clearRect(0,0,W,H);
  x.fillStyle='#3a2430'; x.fillRect(10,26,W-20,H-30); x.fillStyle='#c8d4e0'; x.fillRect(14,30,W-28,H-38); x.fillStyle='#e8eef6'; x.fillRect(26,40,W-52,H-58); x.fillStyle='#d4dde8'; x.fillRect(26,H-30,W-52,12);
  // 수도꼭지와 흐르는 물
  x.fillStyle='#3a2430'; x.fillRect(W/2-34,4,68,14); x.fillStyle='#9aa4b4'; x.fillRect(W/2-32,6,64,10); x.fillRect(W/2-6,16,12,14);
  for(let i=0;i<6;i++){ x.fillStyle=i%2?'#7cc8ff':'#bfe8ff'; x.fillRect(W/2-4,30+((t*160+i*14)%60),8,10); }
  blit(x,c.img,c.ix,c.iy,c.sc);
  c.spots.forEach(s=>{ const r=4+s.hp*3; x.fillStyle='#3a2430'; x.fillRect(s.x-r-2,s.y-r-2,2*r+4,2*r+4); x.fillStyle=c.spotCol; x.fillRect(s.x-r,s.y-r,2*r,2*r);
    if(c.germ){ x.fillStyle='#241820'; x.fillRect(s.x-r/2,s.y-2,3,3); x.fillRect(s.x+r/2-3,s.y-2,3,3); } });
  c.bub.forEach(b=>{ x.globalAlpha=1-b.t/0.8; x.fillStyle='#ffffff'; x.fillRect(b.x,b.y,6,6); x.fillStyle='#bfe8ff'; x.fillRect(b.x+1,b.y+1,2,2); x.globalAlpha=1; });
  // 수세미 커서
  const cx=Math.round(c.cur.x), cy=Math.round(c.cur.y), near=c.spots.some(s=>Math.hypot(s.x-cx,s.y-cy)<=28);
  x.fillStyle='#3a2430'; x.fillRect(cx-19,cy-13,38,26); x.fillStyle='#ffe066'; x.fillRect(cx-17,cy-5,34,16); x.fillStyle='#5ac85a'; x.fillRect(cx-17,cy-11,34,6);
  if(near){ x.fillStyle='#ff9f1a'; x.fillRect(cx-21,cy-15,42,2); x.fillRect(cx-21,cy+13,42,2); }
  x.fillStyle='#3a2430'; x.font='10px Galmuri9'; x.fillText(`남은 ${c.what||'얼룩'} ${c.spots.length}`,W-110,20);
}
function scrubHit(){
  const c=R&&R.mg; if(!c||c.kind!=='scrub'||R.paused) return;
  let hit=false; c.spots.forEach(s=>{ if(Math.hypot(s.x-c.cur.x,s.y-c.cur.y)<=28){ s.hp--; hit=true; for(let i=0;i<3;i++) c.bub.push({x:s.x-10+Math.random()*20,y:s.y-6,t:0}); } });
  for(let i=0;i<2;i++) c.bub.push({x:c.cur.x-14+Math.random()*28,y:c.cur.y-12,t:0});
  c.spots=c.spots.filter(s=>s.hp>0); SFX.tap(); R.me.hop=0.1;
  if(!hit) $('#mgInfo').textContent=`${c.what||'얼룩'} 위로 수세미를 옮겨요!`;
  if(!c.spots.length){ if(c.t<8&&R.active&&c.step) R.active.perfect=true; const f=c.onDone; closeMG(); f(); }
}
function openScrub(st){ scrubPanel({title:st.label,tip:st.tip,img:ingIcon(st),n:5,spotCol:'#9a6a3a',what:'흙 얼룩',verb:'흐르는 물에 구석구석 깨끗이 씻어요.',step:true,icon:spriteURL(IC[R.active.recipe],2),onDone:completeStep}); }

function stirDraw(c){

/* 꾹꾹 누르기 (으깨기 · 뭉치기 · 말기 · 접기) : 줄어드는 틀이 초록 틀에 맞을 때 Space */
function openPress(st){
  const cfg={kind:'press',title:st.label,tip:st.tip,icon:spriteURL(IC[R.active.recipe],2),need:5,n:0,t:0,period:1.3,squash:0,miss:0,img:ingIcon(st)};

  cfg.cv=$('#mgCv'); cfg.cv.addEventListener('pointerdown',e=>{ e.preventDefault(); pressHit(); });
  cfg.tick=dt=>{ cfg.t+=dt; cfg.squash=Math.max(0,cfg.squash-dt); pressDraw(cfg); };
}
function pressSize(c){ const k=(c.t%c.period)/c.period; return 150-130*k; }
const PRESS_TARGET=70;
function pressDraw(c){
  const x=px2(c.cv), W=300,H=170, cx=W/2, cy=H/2+4; x.clearRect(0,0,W,H);
  x.fillStyle='#f2b46a'; x.fillRect(0,0,W,H); x.fillStyle='#d88a40'; for(let y=0;y<H;y+=12) x.fillRect(0,y,W,1);
  const sq=c.squash>0?0.8:1; x.save(); x.translate(cx,cy+24); x.scale(1/sq,sq); blit(x,c.img,-c.img.width*2.5,-c.img.height*5,5); x.restore();
  const frame=(s,col,dash)=>{ const h=Math.round(s/2/2)*2; x.fillStyle=col; for(let i=-h;i<h;i+=dash?8:4){ x.fillRect(cx+i,cy-h,4,4); x.fillRect(cx+i,cy+h-4,4,4); x.fillRect(cx-h,cy+i,4,4); x.fillRect(cx+h-4,cy+i,4,4); } };
  frame(PRESS_TARGET,'#2e8a3e',true); const s=pressSize(c), ok=Math.abs(s-PRESS_TARGET)<=14; frame(s,ok?'#ffcc00':'#ff6fae',false);
  x.fillStyle='#3a2430'; x.font='10px Galmuri9'; x.fillText(`꾹! ${c.n} / ${c.need}`,W-80,18);
}
function pressHit(){
  const c=R&&R.mg; if(!c||c.kind!=='press'||R.paused) return;
  const s=pressSize(c);

  else { c.miss++; SFX.bad(); $('#mgInfo').textContent=s>PRESS_TARGET?'조금 더 기다려요! 너무 빨라요':'아깝다! 조금 늦었어요'; }

function openPlate(st){
  const r=RECIPE(R.active.recipe); let items=(r.steps.find(s=>s.type==='pick')||{items:[]}).items.filter(k=>IC[k]).slice(0,3); while(items.length<3) items.push(items[0]||'rice');
  const cfg={kind:'plate',title:st.label,tip:st.tip,icon:spriteURL(IC[r.id],2),items,i:0,hx:60,dir:1,fall:null,stack:[],t:0,miss:0,dish:IC[r.id]};
  openMG(cfg,`<div class="mgsub">집게가 접시 위에 올 때 <kbd>Space</kbd>! 재료를 예쁘게 담아요</div>${mgCanvas(420,176)}<div class="mgsub" id="mgInfo"></div>`,true);
  cfg.cv=$('#mgCv'); cfg.cv.addEventListener('pointerdown',e=>{ e.preventDefault(); plateDrop(); });
  cfg.tick=dt=>{ cfg.t+=dt; if(!cfg.fall){ cfg.hx+=cfg.dir*150*dt; if(cfg.hx>380){cfg.hx=380;cfg.dir=-1;} if(cfg.hx<40){cfg.hx=40;cfg.dir=1;} }
    else { const f=cfg.fall; f.vy+=700*dt; f.y+=f.vy*dt; const land=128-cfg.stack.length*12;
      if(f.y>=land&&!f.off){ if(Math.abs(f.x-210)<=56){ cfg.stack.push({x:f.x,k:f.k}); cfg.fall=null; cfg.i++; SFX.pop();
          if(cfg.i>=cfg.items.length){ if(cfg.miss===0&&cfg.stack.every(s=>Math.abs(s.x-210)<=26)) R.active.perfect=true; cfg.done=0.5; } }
        else f.off=true; }
      if(f&&f.off&&f.y>200){ cfg.fall=null; cfg.miss++; SFX.bad(); $('#mgInfo').textContent='접시 밖으로 떨어졌어요! 다시 해 봐요'; } }
    if(cfg.done!=null){ cfg.done-=dt; if(cfg.done<=0){ toast('먹음직스럽게 담았어요!','good'); closeMG(); completeStep(); return; } }
    plateDraw(cfg); };
}
function plateDraw(c){
  const x=px2(c.cv), W=420,H=176; x.clearRect(0,0,W,H);
  x.fillStyle='#f7efe2'; x.fillRect(0,0,W,H); x.fillStyle='#ead9c0'; for(let i=0;i<W;i+=24) x.fillRect(i,0,12,H);
  x.fillStyle='#e8404e'; x.fillRect(0,H-26,W,26); x.fillStyle='#ffffff'; for(let i=0;i<W;i+=16) x.fillRect(i+((Math.floor(i/16))%2?8:0),H-26,8,8);
  blit(x,IC.plate,210-72,H-48,12);
  c.stack.forEach((s,i)=>blit(x,IC[s.k],s.x-24,128-i*12-36,4));
  if(c.done!=null) blit(x,c.dish,210-32,30,4);
  if(c.fall) blit(x,IC[c.fall.k],c.fall.x-24,c.fall.y-36,4);
  else if(c.i<c.items.length){ blit(x,IC[c.items[c.i]],c.hx-24,26,4); }

  x.fillStyle='#2e8a3e'; x.fillRect(210-56,H-52,2,6); x.fillRect(210+54,H-52,2,6);

function plateDrop(){ const c=R&&R.mg; if(!c||c.kind!=='plate'||R.paused||c.fall||c.i>=c.items.length) return; c.fall={x:c.hx,y:26+36,vy:0,k:c.items[c.i]}; SFX.tap(); }

function cmdPanel(cfg){

  const dirt=shuffle(cand).slice(0,Math.min(14,cand.length)).map(([px,py])=>({x:ix+px*sc,y:iy+py*sc,s:sc+(Math.random()*sc|0),th:Math.random()}));
  const cfg={kind:'tap',title:st.label,tip:st.tip,need:st.taps||7,ref:R.active,img,icon:spriteURL(IC[R.active.recipe],2),W,H,ix,iy,sc,dirt,drops:[],t:0,shine:0,
    onDone:()=>{ cfg.shine=0.6; cfg.finishing=true; SFX.ok(); }};
  openMG(cfg,`<div class="mgsub">흐르는 물에 <kbd>Space</kbd> 연타! 흙이 쏙쏙 빠져요</div><div class="blocks" id="mgBlocks">${blocks(cfg.need,cfg.ref.prog||0)}</div>${mgCanvas(W,H)}`,true);

function washTap(){
  const c=R&&R.mg; if(!c||c.kind!=='tap'||!c.dirt||c.finishing||R.paused) return;
  c.ref.prog=(c.ref.prog||0)+1; SFX.tap(); R.me.hop=0.1;

}
function washDraw(c){
  const x=px2(c.cv), W=c.W, H=c.H, t=c.t, left=1-(c.finishing?1:(c.ref.prog||0)/c.need); x.clearRect(0,0,W,H);

  x.fillStyle='#3a2430'; x.fillRect(W/2-34,4,68,14); x.fillStyle='#9aa4b4'; x.fillRect(W/2-32,6,64,10); x.fillRect(W/2-6,16,12,14);

function cycleLook(id,field){ S.look=S.look||{}; const a=ALBA.find(x=>x.id===id); const l=S.look[id]=S.look[id]||{c:Math.max(0,LOOK_COLORS.indexOf(a.body)),a:0};
  if(field==='c') l.c=(l.c+1)%LOOK_COLORS.length; else l.a=(l.a+1)%ACCS.length; writeSave(); SFX.pop(); prepScreen(); }

/* ----- 손님 동선 ----- */
function toTablePath(c){ const t=R.tables[c.table]; return [{x:c.x,y:AISLE},{x:t.x,y:AISLE},{x:t.x,y:seatY(t)}]; }
function afterWash(c){
  if(!c.tut&&Math.random()<0.4){ c.state='toWater'; c.path=[{x:c.x,y:AISLE},{x:WSPOT.x,y:AISLE},{x:WSPOT.x,y:WSPOT.y}]; return; }
  c.state='toTable'; c.path=toTablePath(c);
}
function arriveWater(c){
  if(R.cups>0){ R.cups--; c.selfWater=true; c.waterOK=true; R.stats.selfWater++; c.state='selfWater'; c.drinkT=1.4; SFX.pop(); }
  else { c.wantWater=true; c.state='selfWater'; c.drinkT=0.6; toast('정수기 컵이 떨어졌어요! 정수기에서 Space로 컵을 채워요','bad'); SFX.bad(); }
}
function afterPay(c){
  if(owns('vending')&&S.vend.n>0&&Math.random()<(hired('drink')&&alv('drink')>=5?0.55:0.4)){ c.state='toVend'; c.path=[{x:c.x,y:AISLE},{x:VSPOT.x,y:AISLE},{x:VSPOT.x,y:VSPOT.y}]; return; }
  c.state='leaving'; c.path=[{x:c.x,y:AISLE},{x:DOOR.x,y:AISLE},DOOR];
}
function arriveVend(c){
  c.state='vendBuy'; c.drinkT=1.2;
  if(S.vend.n<=0){ c.vendItem=null; return; }
  const id=rand(S.vend.k), d=DRINKS.find(x=>x.id===id); S.vend.n--; c.vendItem=id; bikeVend(id);
  S.money+=VEND_PRICE; R.stats.sales+=VEND_PRICE; R.stats.vend++; SFX.coin(); dropCoins(1);
  addPart('text',VSPOT.x,VSPOT.y-30,`+${won(VEND_PRICE)}원`);
  if(d&&d.good){ addPart('heart',c.x,c.y-24); if(Math.random()<0.25) S.fame++; }
  if(S.vend.n===0) toast('음료 자판기가 비었어요! 자판기에서 Space로 채워요','bad');
}
function xCustTick(c,dt){
  if(c.state==='selfWater'){ c.drinkT-=dt; if(c.drinkT<=0){ c.state='toTable'; c.path=toTablePath(c); } }
  if(c.state==='vendBuy'){ c.drinkT-=dt; if(c.drinkT<=0){ c.state='leaving'; c.path=[{x:c.x,y:AISLE},{x:DOOR.x,y:AISLE},DOOR]; } }
  if(c.state==='wait'||c.state==='eat'){
    if(c.smooIn!=null){ c.smooIn-=dt; if(c.smooIn<=0){ c.smooIn=null; c.smoo=rand(SMOOTHIES).id; c.smooT=40; SFX.pop(); } }

  }
}

/* ----- 자판기 채우기 : 음료 고르기 ----- */
function openVend(){
  const cfg={kind:'vend',title:'음료 자판기 채우기',tip:XTIPS.snack,icon:spriteURL(IC.juice,2,'vjuice'),sel:[...S.vend.k]};
  openMG(cfg,`<div class="mgsub">자판기에 넣을 음료를 <b>3가지</b> 골라요 (숫자키 1∼5) · <kbd>Enter</kbd> 채우기</div><div class="vgrid" id="vGrid"></div>
    <div class="vfoot"><div class="mgsub" id="vInfo"></div><button class="pbtn green small" id="vGo">채우기 <kbd>Enter</kbd></button></div>`,true);
  $('#vGo').onclick=vendConfirm; vendRender();
}
function vendRender(){ const m=R.mg; if(!m||m.kind!=='vend') return; const need=VEND_MAX-S.vend.n;
  $('#vGrid').innerHTML=DRINKS.map((d,i)=>`<button class="vbtn ${m.sel.includes(d.id)?'on':''}" data-v="${i}"><span class="vk">${i+1}</span><img src="${spriteURL(IC[d.id],4,'vd'+d.id)}"><b>${d.n}</b><span style="color:${d.good?'#2e8a3e':'#c02838'}">${d.why}</span></button>`).join('');
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>vendToggle(+b.dataset.v));
  $('#vInfo').innerHTML=`남은 음료 ${S.vend.n}/${VEND_MAX}개 · 채우는 값 ${won(need*VEND_COST)}원<br>(한 병 ${VEND_COST}원에 채워서 손님께 ${won(VEND_PRICE)}원에 팔아요)`; }
function vendToggle(i){ const m=R.mg, d=DRINKS[i]; if(!d) return; const k=m.sel.indexOf(d.id);
  if(k>=0) m.sel.splice(k,1); else { if(m.sel.length>=3) m.sel.shift(); m.sel.push(d.id); if(!d.good){ toast(`${d.n}: ${XTIPS.sugar}`,'tip'); learnTip(XTIPS.sugar); } }
  SFX.pop(); vendRender(); }
function vendConfirm(){ const m=R.mg; if(!m||m.kind!=='vend') return; if(m.sel.length<3){ toast('음료를 3가지 골라요','bad'); SFX.bad(); return; }
  const need=VEND_MAX-S.vend.n, cost=need*VEND_COST; if(need<=0&&m.sel.join()===S.vend.k.join()){ toast('자판기가 가득 차 있어요'); closeMG(); return; }
  S.money-=cost; R.stats.cost+=cost; S.vend={k:[...m.sel],n:VEND_MAX}; closeMG(); SFX.ok();
  const good=m.sel.every(id=>DRINKS.find(d=>d.id===id).good);
  if(good){ toast('몸에 좋은 음료로 가득! 건강 자판기 완성','good'); learnTip(XTIPS.water); } else toast('자판기를 채웠어요. 단 음료는 적게 마시면 좋아요','tip');
}

/* ----- 스무디 만들기 : 재료 넣기 → 갈기 ----- */
function openSmoo(id){
  const s=SMOOTHIES.find(x=>x.id===id), W=200, H=150;
  const cfg={kind:'smoo',title:s.n+' 만들기',tip:XTIPS.fruit,icon:spriteURL(IC['sm_'+id],2),s,added:[],phase:0,blend:0,need:8,W,H,t:0,shake:0,miss:0};
  openMG(cfg,`<div class="mgsub" id="smSub">재료 넣기: <b>${s.ing.map(i=>SMOO_ING.find(x=>x.id===i).n).join(' + ')}</b> (숫자키 1∼7)</div>
    <div class="smRow">${mgCanvas(W,H)}<div class="smIng" id="smIng"></div></div>`,true);
  cfg.cv=$('#mgCv'); cfg.cv.addEventListener('pointerdown',e=>{ e.preventDefault(); smooBlend(); });
  cfg.tick=dt=>{ cfg.t+=dt; cfg.shake=Math.max(0,cfg.shake-dt); if(cfg.done){ cfg.done-=dt; if(cfg.done<=0) smooFinish(); } smooDraw(cfg); };
  smooRender(); smooDraw(cfg);
}
function smooRender(){ const m=R.mg; if(!m||m.kind!=='smoo') return;
  $('#smIng').innerHTML=SMOO_ING.map((g,i)=>`<button class="sbtn ${m.added.includes(g.id)?'on':''}" data-g="${i}" ${m.phase?'disabled':''}><span class="vk">${i+1}</span><img src="${spriteURL(IC[g.id],3,'sg'+g.id)}">${g.n}</button>`).join('');
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>smooAdd(+b.dataset.g)); }
function smooAdd(i){ const m=R.mg, g=SMOO_ING[i]; if(!m||m.kind!=='smoo'||m.phase||!g||m.added.includes(g.id)) return;
  if(!m.s.ing.includes(g.id)){ m.miss++; m.shake=0.3; SFX.bad(); const tip=['cola','sugar','candy'].includes(g.id)?XTIPS.sugar:'이 스무디에는 들어가지 않아요';
    toast(`${g.n}${josa(g.n,'은','는')} 넣지 않아요! ${tip}`,'bad'); if(tip===XTIPS.sugar) learnTip(XTIPS.sugar); return; }
  m.added.push(g.id); SFX.pop(); if(g.id==='milk') learnTip(XTIPS.milk);
  if(m.s.ing.every(x=>m.added.includes(x))){ m.phase=1; $('#smSub').innerHTML=`뚜껑 닫고 <kbd>Space</kbd> 연타로 위잉~ 갈아요! <span class="blocks" id="mgBlocks">${blocks(m.need,0)}</span>`; }
  smooRender(); }
function smooBlend(){ const m=R&&R.mg; if(!m||m.kind!=='smoo'||R.paused||m.done) return;
  if(!m.phase){ toast('재료를 먼저 넣어요 (숫자키 1∼7)'); return; }
  m.blend++; m.shake=0.12; SFX.tap(); R.me.hop=0.1; $('#mgBlocks').innerHTML=blocks(m.need,m.blend);
  if(m.blend>=m.need){ m.done=0.6; SFX.ok(); } }
function smooFinish(){ const m=R.mg; closeMG(); hold({kind:'smoothie',id:m.s.id});
  toast(`${m.s.n} 완성! 주문한 손님에게 가져다줘요`,'good'); }
function smooDraw(c){
  const x=px2(c.cv), W=c.W, H=c.H, t=c.t, sh=c.shake>0?(Math.floor(t*40)%2?2:-2):0; x.clearRect(0,0,W,H);
  x.fillStyle='#f2b46a'; x.fillRect(0,H-26,W,26); x.fillStyle='#d88a40'; x.fillRect(0,H-26,W,3);
  const bx=W/2-40+sh, by=16;
  // 본체
  x.fillStyle='#3a2430'; x.fillRect(bx+6,by+86,68,24); x.fillStyle='#ff6fae'; x.fillRect(bx+9,by+89,62,18); x.fillStyle='#ffe066'; x.fillRect(bx+34,by+93,12,10);
  // 컵
  x.fillStyle='#3a2430'; x.fillRect(bx,by,80,88); x.fillStyle='#e8f6ff'; x.fillRect(bx+4,by+4,72,80);
  if(c.phase){ x.fillStyle='#3a2430'; x.fillRect(bx-4,by-10,88,12); x.fillStyle='#9aa4b4'; x.fillRect(bx-2,by-8,84,8); }
  const lvl=c.phase?Math.min(1,0.45+c.blend/c.need*0.5):0;
  if(c.phase){ const fill=c.blend/c.need; x.fillStyle=fill>0.5?c.s.col:'#fff6e8'; const hh=Math.round(80*lvl); x.fillRect(bx+4,by+84-hh,72,hh);
    x.fillStyle=c.s.lt; for(let i=0;i<5;i++){ const a=t*12+i*1.3; x.fillRect(bx+40+Math.cos(a)*24-3,by+84-hh/2+Math.sin(a)*hh/3,6,4); } }
  // 넣은 재료
  if(!c.phase||c.blend<c.need/2) c.added.forEach((id,i)=>{ const bob=c.phase?Math.sin(t*20+i)*6:0; blit(x,IC[id],bx+6+i*22,by+50-i*12+bob,2); });
  x.fillStyle='#ffffff'; x.fillRect(bx+8,by+10,4,48);
  if(c.done){ x.fillStyle='#ffe066'; const k=Math.floor(t*12)%2; [[bx-14,by+20],[bx+90,by+40],[bx+40,by-22]].forEach(([sx,sy],i)=>{ const r=(i+k)%2?8:5; x.fillRect(sx-r,sy,2*r+1,3); x.fillRect(sx,sy-r,3,2*r+1); }); }
}

function updateDrinkAlba(dt){
  if(!hired('drink')) return; R.albaT.drink+=dt;
  if(R.cups<CUP_MAX&&R.albaT.drink>1.5&&R.cups<=2){ R.cups=CUP_MAX; R.albaT.drink=0; addPart('spark',WATER.x+12,WATER.y); return; }
  if(owns('vending')&&S.vend.n<=2&&R.albaT.drink>2){ const need=VEND_MAX-S.vend.n; S.money-=need*VEND_COST; R.stats.cost+=need*VEND_COST; S.vend.n=VEND_MAX; R.albaT.drink=0; addPart('spark',VEND.x+12,VEND.y+10); return; }
  if(owns('smoothie')&&R.albaT.drink>6*(1-0.12*(alv('drink')-1))){ const c=R.customers.filter(x=>x.smoo&&!x.smooAlba).sort((a,b)=>a.smooT-b.smooT)[0];
    if(c&&!R.smooJob){ R.albaT.drink=0; c.smooAlba=true; R.smooBusy=true; R.smooJob={c,t:1.5}; } }
  if(R.smooJob){ const j=R.smooJob; j.t-=dt; if(j.t<=0){ R.smooJob=null; R.smooBusy=false; const c=j.c; c.smooAlba=false; if(c.smoo&&(c.state==='wait'||c.state==='eat')){ giveSmoo(c); addPart('spark',c.x,c.y-20); } } }
}
function drinkAlbaPos(time){ return owns('smoothie')?{x:SMOO.x+SMOO.w/2+Math.sin(time*0.8)*30,y:SMOO.y+2}:{x:WATER.x-14,y:WATER.y-14}; }
function giveSmoo(c){ c.smoo=null; c.smooOK=true; R.stats.smoothie++; c.extra=(c.extra||0)+SMOO_PRICE+(hired('drink')&&alv('drink')>=3?300:0); addPart('heart',c.x,c.y-24); SFX.ok(); }

function mannerPick(i){ const m=R.mg; if(!m||m.kind!=='manner') return; const c=m.c, M=c.manner; closeMG();

function trashRoll(t){ if(Math.random()<0.35){ const pool=shuffle([...TRASH]); t.trash=[TRASH[0],...pool.filter(x=>x.id!=='leftover').slice(0,1+(Math.random()<0.5?1:0))]; } }
function playerClear(t){
  if(t.trash&&t.trash.length){ const items=t.trash; t.trash=null; clearTable(t); SFX.pop(); return openTrash(items); }
  clearTable(t); SFX.pop();
}
function openTrash(items){
  const cfg={kind:'trash',title:'분리배출하기',tip:CONTENT.tips.clean,icon:spriteURL(IC.leftover,2,'lo2'),items,i:0,miss:0};
  openMG(cfg,`<div class="mgsub">손님이 남긴 것을 알맞은 통에 버려요! (숫자키 1∼3)</div><div class="trow"><div class="titem" id="tItem"></div>
    <div class="tbins">${BINS.map((b,i)=>`<button class="tbin" data-b="${i}" style="background:${b.col}"><kbd>${i+1}</kbd>${b.n}</button>`).join('')}</div></div><div class="blocks" id="mgBlocks">${blocks(items.length,0)}</div>`,true);
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>trashPick(+b.dataset.b)); trashRender();
}
function trashRender(){ const m=R.mg; if(!m||m.kind!=='trash') return; const it=m.items[m.i];
  $('#tItem').innerHTML=`<img src="${spriteURL(IC[it.id],6,'tr'+it.id)}"><b>${it.n}</b>`; $('#mgBlocks').innerHTML=blocks(m.items.length,m.i); }
function trashPick(b){ const m=R.mg; if(!m||m.kind!=='trash') return; const it=m.items[m.i];
  if(b!==it.bin){ m.miss++; SFX.bad(); const el=$('#tItem'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); toast(`${it.n}${josa(it.n,'은','는')} ${BINS[it.bin].n}${it.bin===2?' 통':''}에 버려요!`,'bad'); return; }
  SFX.pop(); m.i++;
  if(m.i>=m.items.length){ closeMG(); R.stats.recycle=(R.stats.recycle||0)+1; R.kitchen=Math.min(100,R.kitchen+8); learnTip(CONTENT.tips.clean);
    toast(m.miss?'분리배출 완료!':'분리배출 완벽해요! 주방도 깨끗해졌어요','good'); if(!m.miss){ S.fame+=Math.random()<0.5?1:0; } return; }
  trashRender(); }

function tutServed(){ const c=tutCust(); return !c||['eat','toPay','leaving','bye','toVend','vendBuy'].includes(c.state); }
function tutBegin(){
  R.tut={i:-1}; R.tutPos={x:R.me.x,y:R.me.y};
  let el=$('#tutBox'); if(!el){ el=document.createElement('div'); el.id='tutBox'; $('#mg').parentNode.appendChild(el); }
  el.className='tutbox'; tutNext();
}
function tutNext(){
  const t=R.tut; if(!t) return; t.i++; const st=TUT[t.i]; if(!st) return tutEnd(false);
  if(st.start) st.start();
  document.querySelectorAll('.tutHi').forEach(e=>e.classList.remove('tutHi')); if(st.hi&&$(st.hi)) $(st.hi).classList.add('tutHi');
  $('#tutBox').innerHTML=`<img src="${bossURL('idle',1)}"><div class="tt"><div class="tn">곰 사장님의 영업 연습 <span>${t.i+1} / ${TUT.length}</span></div><div>${st.say}</div>
    <div class="tf"><button class="pbtn small" id="tutSkip">연습 건너뛰기</button>${st.manual?`<button class="pbtn small green" id="tutGo">${st.last?'영업 시작! ':'다음 ▶ '}<kbd>Enter</kbd></button>`:''}</div></div>`;
  $('#tutSkip').onclick=()=>tutEnd(true); if($('#tutGo')) $('#tutGo').onclick=()=>tutNext();
  SFX.pop(); cv.focus();
}
function tutTick(){
  const t=R.tut; if(!t) return; const st=TUT[t.i]; if(!st||st.manual) return;
  if(st.done()){ t.i===TUT.length-1?tutEnd(false):(SFX.ok(),tutNext()); }
}
function tutSpawn(){
  spawnCustomer(); const c=R.customers[R.customers.length-1];
  c.tut=true; c.need=null; c.qty=1; c.birthday=false; c.acc=2; c.sp='rabbit'; c.body='#ff9ec7'; c.type=CTYPES[0];
  const id=S.unlocked.includes('steamedsp')?'steamedsp':S.menu[0]; c.recipe=id;

  const t=R.tut; if(!t) return; R.tut=null; S.tutDone=true; writeSave();
  document.querySelectorAll('.tutHi').forEach(e=>e.classList.remove('tutHi')); const el=$('#tutBox'); if(el) el.remove();

  toast(skipped?'연습을 건너뛰었어요. 막히면 오른쪽 「다음 할 일」을 봐요!':'영업 연습 완료! 이제 진짜 손님들이 와요','good');
  setTimeout(()=>{ if(R&&R.missions) toast('오늘의 목표: '+R.missions.map(m=>m.label).join(' · '),'tip'); },900);

  const t=R.tut; if(!t) return; const st=TUT[t.i]; let p=st&&st.at?st.at():null; const box=$('#tutBox');

  if(!p) return;
  if(typeof p==='string'){ const s=ST[p]; if(!s) return; p={x:s.x+s.w/2,y:s.bottom?s.y-14:s.y-2}; outline(s.x-3,s.y-3,s.w+6,s.h+6,Math.floor(time*4)%2?'#ff3f8f':'#ffe066'); }
  const b=Math.round(Math.abs(Math.sin(time*5))*5), x=Math.round(p.x), y=Math.round(p.y)-12-b;
  rr(ctx,x-4,y-10,9,8,'#3a2430'); rr(ctx,x-3,y-9,7,7,'#ffe066'); rr(ctx,x-7,y-3,15,2,'#3a2430');

}

function drawClassroom(cv,t,glow){
  const x=cv.getContext('2d'); x.imageSmoothingEnabled=false; const r=(a,b,w,h,c)=>{ x.fillStyle=c; x.fillRect(a,b,w,h); };
  r(0,0,320,180,'#f6ead0'); r(0,0,320,6,'#e8d4ae'); r(0,118,320,62,'#c99a62'); for(let y=124;y<180;y+=8) r(0,y,320,1,'#b07e48'); for(let i=0;i<12;i++) r((i*37)%320,124+((i*3)%7)*8,1,8,'#b07e48');
  r(0,114,320,5,'#a8743e');
  // 창문
  [[12,24],[252,24]].forEach(([wx,wy])=>{ r(wx-2,wy-2,60,64,'#8a5a34'); r(wx,wy,56,60,'#9fdcff'); r(wx,wy+40,56,20,'#bfe8ff'); r(wx+27,wy,2,60,'#8a5a34'); r(wx,wy+29,56,2,'#8a5a34');
    const cx=wx+((t*6)%70)-10; r(cx,wy+10,16,5,'#ffffff'); r(cx+4,wy+7,9,4,'#ffffff'); r(wx-4,wy+62,64,3,'#e8d4ae'); });
  // 칠판
  r(84,16,152,78,'#8a5a34'); r(88,20,144,70,'#2f5a3e'); r(88,86,144,4,'#c8a070'); r(100,87,10,2,'#ffffff'); r(120,87,6,2,'#ff9fbf');
  const b1=txt8('실과: 요리 실습!','#ffffff',null), b2=txt8('준비하기 → 만들기 → 뒷정리','#ffe066',null,'8px Galmuri7');
  x.drawImage(b1,Math.round(160-b1.width/2),30); x.drawImage(b2,Math.round(160-b2.width/2),52);
  // 시계 · 게시판
  r(240,6,14,14,'#3a2430'); r(241,7,12,12,'#ffffff'); r(247,9,1,5,'#3a2430'); r(247,13,3,1,'#3a2430');
  r(64,10,14,10,'#ff9fbf'); r(66,12,10,6,'#ffffff');
  // 책상
  [[40,128],[160,132],[276,128]].forEach(([dx,dy],i)=>{ r(dx-34,dy,68,8,'#e2a05a'); r(dx-34,dy+8,68,3,'#b07a3c'); r(dx-30,dy+11,3,24,'#8a5a34'); r(dx+27,dy+11,3,24,'#8a5a34');
    if(i!==1){ x.drawImage(i?IC.egg:IC.sweetpotato,dx-20,dy-10); x.drawImage(IC.knife,dx+4,dy-6); } });
  // 가운데 책상 위 실과책
  const bx=146,by=120; r(bx,by,28,12,'#3a2430'); r(bx+1,by+1,13,10,'#fffaf0'); r(bx+14,by+1,13,10,'#fffaf0'); r(bx+14,by,1,12,'#c8a070');
  r(bx+3,by+4,8,1,'#c8c8d8'); r(bx+3,by+7,6,1,'#c8c8d8'); r(bx+17,by+3,7,7,'#ff9a3a'); r(bx+18,by+4,5,5,'#5ac85a');
  if(glow){ const k=0.5+0.5*Math.sin(t*10); x.globalAlpha=0.35+0.4*k; x.fillStyle='#fff6a0'; for(let rr2=8;rr2<60;rr2+=10){ x.globalAlpha=(0.5-rr2/140)*(0.6+0.4*k); x.fillRect(bx+14-rr2,by+6-rr2*0.7,rr2*2,rr2*1.4); } x.globalAlpha=1;
    for(let i=0;i<8;i++){ const a=t*2+i*0.8, d=20+((t*30+i*9)%40); r(Math.round(bx+14+Math.cos(a)*d),Math.round(by+6+Math.sin(a)*d*0.6),2,2,'#ffe066'); } }
}

const FEVER_AT=5, FEVER_LEN=20;

  if(!R) return; if(!ok){ comboBreak(); return; }
  if(R.fever>0) return; R.combo=(R.combo||0)+1; R.stats.maxCombo=Math.max(R.stats.maxCombo||0,R.combo);

}

function drawComboHUD(time){
  if(!R) return;
  if(R.fever>0){ const k=Math.floor(time*8)%6, cols=['#ff4f8f','#ffb830','#ffe066','#5ac85a','#7ac8ff','#c7a2ff'];

  if(R.dash>0){ R.dash-=dt; if(R.me.moving&&Math.random()<0.5) addPart('dust',R.me.x+(Math.random()-0.5)*8,R.me.y); }

/* ----- 찬물에 식혀 껍데기 벗기기 (삶은 달걀) ----- */
function peeledEgg(){ if(IC._peeled) return IC._peeled; const s=IC.egg, c=document.createElement('canvas'); c.width=s.width; c.height=s.height; const x=c.getContext('2d'); x.drawImage(s,0,0);
  const d=x.getImageData(0,0,c.width,c.height), a=d.data; for(let i=0;i<a.length;i+=4){ if(!a[i+3]) continue; const lum=a[i]+a[i+1]+a[i+2]; if(lum<220) continue; const sh=lum<560; a[i]=sh?236:255; a[i+1]=sh?230:253; a[i+2]=sh?218:246; }
  x.putImageData(d,0,0); return IC._peeled=c; }
function openCool(st){
  const img=IC.egg, W=440, H=170, sc=9, ix=Math.round(180-img.width*sc/2), iy=34;
  const cfg={kind:'tap',cool:true,title:st.label,tip:st.tip,need:10,ref:R.active,img,icon:spriteURL(IC[R.active.recipe],2),W,H,ix,iy,sc,chips:[],t:0,shine:0};
  openMG(cfg,`<div class="mgsub" id="coolSub">뜨거운 달걀을 <b>찬물</b>에 담가 식혀요! <kbd>Space</kbd> 연타</div><div class="blocks" id="mgBlocks">${blocks(cfg.need,cfg.ref.prog||0)}</div>${mgCanvas(W,H)}`,true);
  cfg.cv=$('#mgCv'); cfg.cv.addEventListener('pointerdown',e=>{ e.preventDefault(); coolTap(); });
  cfg.tick=dt=>{ cfg.t+=dt; cfg.chips.forEach(p=>{ p.vy+=420*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.t+=dt; }); cfg.chips=cfg.chips.filter(p=>p.t<0.8);
    if(cfg.finishing){ cfg.shine-=dt; if(cfg.shine<=0){ closeMG(); completeStep(); return; } } coolDraw(cfg); };
  coolDraw(cfg);
}
function coolTap(){
  const c=R&&R.mg; if(!c||!c.cool||c.finishing||R.paused) return;
  c.ref.prog=(c.ref.prog||0)+1; SFX.tap(); R.me.hop=0.1; const half=c.need/2;
  if(c.ref.prog>half) for(let i=0;i<4;i++) c.chips.push({x:c.ix+20+Math.random()*c.img.width*c.sc*0.7,y:c.iy+20+Math.random()*40,vx:(Math.random()-0.5)*200,vy:-140-Math.random()*100,t:0,col:Math.random()<0.5?'#f2dcc0':'#e2c4a0'});
  if(Math.abs(c.ref.prog-half)<0.5){ $('#coolSub').innerHTML='다 식었어요! 톡톡 깨서 <b>껍데기를 벗겨요</b> <kbd>Space</kbd> 연타'; SFX.pop(); }
  $('#mgBlocks').innerHTML=blocks(c.need,c.ref.prog);
  if(c.ref.prog>=c.need){ c.ref.prog=0; c.finishing=true; c.shine=0.7; SFX.ok(); toast('껍데기를 매끈하게 벗겼어요!','good'); }
}
function coolDraw(c){
  const x=px2(c.cv), W=c.W, H=c.H, t=c.t, p=c.finishing?c.need:(c.ref.prog||0), half=c.need/2, cool=Math.min(1,p/half), peel=Math.max(0,(p-half)/half);
  x.clearRect(0,0,W,H);
  // 그릇 + 찬물 + 얼음
  x.fillStyle='#3a2430'; x.fillRect(40,70,280,92); x.fillStyle='#e8eef6'; x.fillRect(44,74,272,84);
  x.fillStyle='#7cc8ff'; x.fillRect(48,96,264,58); x.fillStyle='#bfe8ff'; for(let i=0;i<6;i++) x.fillRect(56+((i*47+t*30)%240),100+(i%3)*14,14,3);
  [[70,92],[250,96],[280,110]].forEach(([a,b],i)=>{ x.fillStyle='#ffffff'; x.fillRect(a,b+Math.sin(t*3+i)*2,14,12); x.fillStyle='#d8f0ff'; x.fillRect(a+3,b+3+Math.sin(t*3+i)*2,6,5); });
  // 달걀 (껍데기 → 벗겨진 흰자)
  const ew=c.img.width*c.sc, eh=c.img.height*c.sc, bob=Math.round(Math.sin(t*4)*2);
  blit(x,c.img,c.ix,c.iy+bob,c.sc);
  if(peel>0){ const rows=Math.round(c.img.height*peel), pe=peeledEgg(); x.imageSmoothingEnabled=false;
    x.drawImage(pe,0,c.img.height-rows,c.img.width,rows,c.ix,c.iy+bob+eh-rows*c.sc,ew,rows*c.sc); }
  if(p>half-0.5&&peel<1){ x.fillStyle='#8a6a50'; const ry=c.iy+bob+Math.round(c.img.height*(1-peel))*c.sc-c.sc; for(let i=2;i<c.img.width-2;i++) if(i%2===0) x.fillRect(c.ix+i*c.sc,ry+((i/2)%2)*c.sc,c.sc,c.sc/3|0||2); }
  // 김 (식을수록 사라짐)
  if(cool<1){ x.globalAlpha=1-cool; for(let i=0;i<3;i++){ const sx=c.ix+ew/2-20+i*20, sy=c.iy-6-((t*30+i*10)%26); x.fillStyle='#ffffff'; x.fillRect(sx,sy,6,10); x.fillRect(sx+4,sy-8,6,8); } x.globalAlpha=1; }
  c.chips.forEach(q=>{ x.fillStyle=q.col; x.fillRect(q.x,q.y,7,5); });
  // 온도계
  const tx=372, ty=24, temp=Math.round(90-70*cool); x.fillStyle='#3a2430'; x.fillRect(tx-2,ty-2,18,118); x.fillStyle='#ffffff'; x.fillRect(tx,ty,14,114);
  const fh=Math.round(100*(temp-10)/90); x.fillStyle=temp>50?'#ff5a5a':'#5aa8ff'; x.fillRect(tx+4,ty+104-fh,6,fh+8);
  x.fillStyle='#3a2430'; x.font='10px Galmuri9'; x.fillText(`${temp}℃`,tx-4,ty+128);
  if(c.finishing){ const k=Math.floor(t*12)%2; x.fillStyle='#ffe066'; [[c.ix-12,c.iy],[c.ix+ew+6,c.iy+20],[c.ix+ew/2,c.iy-16]].forEach(([sx,sy],i)=>{ const r=(i+k)%2?8:5; x.fillRect(sx-r,sy,2*r+1,3); x.fillRect(sx,sy-r,3,2*r+1); }); }
}

function updateAlba(dt){
  updateDrinkAlba(dt);
  if(hired('counter')){ const c=R.customers.find(x=>x.state==='order'); if(c){ R.albaT.counter+=dt; if(R.albaT.counter>1.2*(1-0.15*(alv('counter')-1))){ R.albaT.counter=0; takeOrder(c,true); } } else R.albaT.counter=0; }
  if(hired('dish')){ R.albaT.dish+=dt; if(R.albaT.dish>2.5*(1-0.12*(alv('dish')-1))){ R.albaT.dish=0; if(alv('dish')>=4&&R.soap<=1){ R.soap=soapMax(); addPart('spark',SOAP.x+6,SOAP.y); } const t=R.tables.find(x=>x.dirty); if(t) clearTable(t); else if(R.dirty>0){ const n=Math.min(2+(alv('dish')>=3?1:0)+(alv('dish')>=5?1:0),R.dirty); R.dirty-=n; R.clean+=n; addPart('spark',435,246); } } }
  if(hired('clean')){ R.kitchen=Math.min(100,R.kitchen+dt*0.6*(1+0.25*(alv('clean')-1))); R.albaT.hall+=dt; if(R.albaT.hall>2.5*(1-0.12*(alv('clean')-1))){ R.albaT.hall=0; if(alv('clean')>=4&&R.cups<=1) R.cups=CUP_MAX; const c=R.customers.find(x=>x.water!=null); if(c){ c.water=null; c.waterOK=true; addPart('heart',c.x,c.y-24); } } }
  if(hired('serve')&&alv('serve')>=3){ R.albaT.sw=(R.albaT.sw||0)+dt; if(R.albaT.sw>3){ R.albaT.sw=0; const c=R.customers.find(x=>x.water!=null); if(c){ c.water=null; c.waterOK=true; R.stats.water++; addPart('heart',c.x,c.y-24); } } }
  if(hired('serve')){ const sv=R.server;
    if(sv.state==='idle'){ const held=R.holding&&R.holding.kind==='dish'?R.holding.dish:null;
      for(const d of R.ready){ if(d===held) continue; const c=R.customers.find(x=>x.state==='wait'&&x.recipe===d.recipe&&x.pending>(x.coming||0));
        if(c){ R.ready.splice(R.ready.indexOf(d),1); sv.dish=d; sv.c=c; c.coming=(c.coming||0)+1; sv.state='go'; break; } } }
    const tgt=sv.state==='go'?{x:R.tables[sv.c.table].x+22,y:R.tables[sv.c.table].y+2}:{x:245,y:198};
    if(sv.state!=='idle'){ const dx=tgt.x-sv.x, dy=tgt.y-sv.y, d=Math.hypot(dx,dy), st=80*(1+0.15*(alv('serve')-1))*dt; sv.anim+=dt;
      if(d<=st){ sv.x=tgt.x; sv.y=tgt.y;
        if(sv.state==='go'){ const c=sv.c; c.coming=Math.max(0,(c.coming||1)-1);
          if(c.state==='wait'&&c.pending>0) serveDish(c,sv.dish); else R.ready.push(sv.dish);
          sv.dish=null; sv.c=null; sv.state='back'; }
        else sv.state='idle'; }
      else { sv.x+=dx/d*st; sv.y+=dy/d*st; } } }

function tone(f,t0,d,type,v){ try{ const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+d); o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+d+0.03);}catch(e){} }
function music(track){ curTrack=track; bgmStop(); bgmStart(); }
function bgmStart(){
  if(BGM||!sound||!musicOn||!curTrack) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){ return; }
  const T=TRACKS[curTrack], E=T.beat, L=T.lead_; BGM={t:actx.currentTime+0.1,i:0,track:curTrack};
  const pump=()=>{ if(!BGM) return;
    while(BGM.t<actx.currentTime+0.6){ const i=BGM.i%L.length, n=L[i];
      if(n!=='-'&&n!=='.'){ let len=1; while(L[(i+len)%L.length]==='-'&&len<4) len++; tone(NOTE[n],BGM.t,E*len*0.92,T.lead,T.lv); }
      if(i%2===0){ const b=T.bass[(i/2)%T.bass.length]; tone(NOTE[b],BGM.t,E*1.7,'triangle',0.045); }
      if(curTrack==='game'&&i%4===2) tone(1800,BGM.t,0.025,'square',0.004);
      BGM.t+=E; BGM.i++; }
    BGM.timer=setTimeout(pump,150); };
  pump();
}
function bgmStop(){ if(BGM){ clearTimeout(BGM.timer); BGM=null; } }
function setMusic(on){ musicOn=on; try{ localStorage.setItem('yk-music',on?'1':'0'); }catch(e){} if(on){ sound=true; bgmStart(); } else bgmStop();
  document.querySelectorAll('.musicBtn').forEach(b=>b.textContent=musicOn?'♪ 음악 끄기':'♪ 음악 켜기'); const pb=$('#btnMusic'); if(pb) pb.textContent=musicOn?'♪ 켬':'♪ 끔'; }

function fanfare(){ if(!sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t=actx.currentTime; [['G4',0,.12],['C5',.12,.12],['E5',.24,.12],['G5',.36,.3],['E5',.7,.12],['G5',.82,.5]].forEach(([n,d,l])=>tone(NOTE[n],t+d,l,'square',0.03)); }catch(e){} }

    4. <b>요리사 위생</b> — 손 위생이 50보다 낮으면 재료를 만질 수 없어요. 날달걀을 만진 뒤에도 손을 씻어요!<br>
    5. <b>대접</b> — 완성대에서 음식을 들고(Space) 그 음식을 기다리는 테이블로 가서 Space!<br>
    6. <b>물</b>방울 손님에게는 정수기 물, <b>식품군</b>을 원하는 손님에게는 반찬 냉장고의 알맞은 반찬! 정수기 <b>컵</b>이 떨어지면 채워요(물은 셀프).<br>
    7. <b>정리</b> — 떠난 손님 테이블의 그릇을 치우고, 설거지하고, 주방을 청소해요.<br>
    ★ <b>영업 시간</b> — 9시에 문을 열어요. 17시 30분 <b>라스트 오더</b>부터 새 손님이 오지 않고, 18시에 <b>주문 마감</b>! 남은 손님까지 대접하면 문을 닫아요.<br>
    8. <b>테이블 늘리기</b> — 홀의 점선 빈자리로 가서 Space! (돈이 필요해요)<br>
    ★ <b>음료 자판기</b>·<b>스무디 바</b>는 상점에서 들여요. 자판기는 몸에 좋은 음료로 채우고, 스무디는 재료(숫자키)를 넣고 Space로 갈아요!<br>
    ★ <b>분리배출</b>: 남긴 것이 있는 테이블을 치우면 음식물·일반·재활용 통에 나눠 버려요(숫자키). <b>식사 예절</b>: 「탕탕!」 같은 말풍선 손님에게 가서 Space로 바른 예절을 알려 줘요. <b>아침 장보기</b>: 준비 화면에서 지역 식품을 사면 손님 만족도가 올라요.<br>
    ★ <b>알바 키우기</b>: 준비 화면 알바 카드의 「키우기」! 함께 일한 날이 쌓이면 능력을 올릴 수 있어요. <b>마스터 모드</b>: 엔딩 뒤에도 계속 장사하며 마스터 별을 모아요.<br>
    ★ <b>골고루 자전거</b>: 손님이 먹은 식품군(곡류, 고기·생선·달걀·콩류, 채소류, 과일류, 우유·유제품류)과 물이 하루 동안 모두 채워지면 보너스! 반찬·스무디·물로 빈칸을 채워요. <b>도전 과제</b>: 준비 화면에서 확인해요.<br>
    ★ <b>칼질</b>: 채썰기 <kbd>←</kbd><kbd>Space</kbd> · 어슷썰기 <kbd>↑</kbd><kbd>←</kbd><kbd>Space</kbd> · 잘게 썰기 <kbd>←</kbd><kbd>Space</kbd><kbd>Space</kbd> (WASD도 돼요).<br>
    ★ <b>콤보·피버</b>: 손님을 연속으로 만족시키면 콤보! 5콤보면 20초 동안 FEVER(팁 2배). <b>스킬</b>: <kbd>Shift</kbd> 대시(Lv.1) · <kbd>Q</kbd> 응원(Lv.3) · <kbd>R</kbd> 정리정돈(Lv.5).<br>
    9. <b>질문 손님</b>·<b>위생 점검관</b>의 문제를 맞히면(숫자키 1∼4) 명성과 돈이 올라요.
    <div style="margin-top:6px;color:#6b5a62">${CREDIT} · 실과 내용: 5·6학년 실과 교과서(이춘식) 식생활 단원 · 글꼴: 갈무리(SIL OFL)</div><div class="center" style="margin-top:8px"><button class="pbtn" id="bBack">알겠어요! (Enter)</button> <button class="pbtn small" id="bTut">${S.tutNext?'다음 영업에서 연습해요 ✓':'영업 연습(튜토리얼) 다시 하기'}</button></div></div></div>`);
  $('#bBack').onclick=back; $('#bTut').onclick=()=>{ S.tutNext=true; writeSave(); SFX.ok(); toast('다음 영업을 시작하면 곰 사장님의 영업 연습이 나와요','good'); $('#bTut').textContent='다음 영업에서 연습해요 ✓'; };
}
function prepScreen(){
  if(curTrack!=='title') music('title');
  if(!R||R.paused===false) newRun();
  R.paused=true; closeMG();
  S.menu=S.menu.filter(id=>S.unlocked.includes(id)); while(S.menu.length<2) S.menu.push(S.unlocked[S.menu.length%S.unlocked.length]);
  const cards=ALBA.map(a=>{ const lock=S.level<a.lv, on=a.base||!!S.hired[a.id];
    return `<div class="acard"><div class="role">${a.role}</div><div class="box" data-a="${a.id}" style="cursor:${lock?'not-allowed':'pointer'}">
      <div class="portrait"><img src="${spriteURL(albaSprite(a.id,0),4,'al'+a.id+lookOf(a).body+lookOf(a).acc)}">${lock?'':`<div class="lookBtns"><button data-lc="${a.id}">옷 색</button><button data-la="${a.id}">${ACCS[lookOf(a).acc]}</button></div>`}${a.base?'<div class="stamp ok sm">기본 근무</div>':on?'<div class="stamp ok">채용됨</div>':''}${lock?`<div class="stamp no">고용불가<br><span style="font-size:12px">Lv.${a.lv}부터</span></div>`:''}</div>
      <div class="nm">${a.nm}</div><div class="wg">일당 ${won(albaWage(a))}원${a.base?' (기본)':''}</div>${lock?'':`<div class="alvl">Lv.${alv(a.id)} ${lvStars(alv(a.id))}</div>`}<div class="ds">${a.ds}</div>${lock?'':`<button class="pbtn small trainBtn" data-tr="${a.id}">키우기</button>`}
      <div style="font-size:12px;color:#2a6ad0">${lock||a.base?'':on?'눌러서 그만두기':'눌러서 고용하기'}</div></div></div>`; }).join('');
  const mcol=(slot,left)=>`<div class="mcol" style="left:${left}px"><div class="h">오늘의 메뉴 ${slot+1} 선택</div><div class="micons">${CONTENT.recipes.map(r=>{ const own=S.unlocked.includes(r.id);
      return `<button class="mic ${S.menu[slot]===r.id?'on':''} ${own?'':'lock'}" data-s="${slot}" data-r="${r.id}" title="${r.name}"><img src="${spriteURL(IC[r.id],2,'mm'+r.id)}"></button>`; }).join('')}</div>
      <div class="mdesc">${menuDesc(S.menu[slot])}</div></div>`;
  const nt=S.tables, np=SLOT_PRICE[nt];
  showModal(`<div class="scr green">
    <div class="prepHead"><div class="logo" style="font-size:40px"><span class="lw1">요리킹</span> <span class="lw2">조리킹</span></div><div class="sub">: ${S.day}일차 준비 — 알바 고용하기</div></div>
    <div class="cards">${cards}</div>
    <div class="prepSmall"><div class="pill">${won(S.money)}원</div><button class="pbtn small" id="pStage" style="font-size:12px">${isMaster()?`👑 마스터 ★${S.master||0} · 기록 보기`:`${'★'.repeat(STAGES[S.stage].star)||'☆'} ${STAGES[S.stage].n} · 등급 보기`}</button><div class="pill">Lv.${S.level} · 명성 ${S.fame}</div>
      <div class="pill" style="font-size:12px">테이블 ${nt}/6개${nt<6?`<br><button class="pbtn small" id="pTable" style="margin-top:4px">테이블 늘리기 ${won(np)}원</button>`:''}</div>
      <button class="pbtn small ${marketDone()?'':'hot'}" id="pMarket">${marketDone()?(S.market.local?'🧺 장보기 완료: 동네 농장':'🧺 장보기 완료: 먼 나라'):'🧺 아침 장보기 (지역 식품)'}</button><button class="pbtn small" id="pShop">도구·레시피 상점</button><button class="pbtn small" id="pAch">🏅 도전 과제 ${achCount()} / ${ACH.length}</button><button class="pbtn small" id="pNote">실과 노트</button><button class="pbtn small" id="pTitle">처음 화면</button></div>
    ${wageBox()}
    <div class="menuArea">${mcol(0,24)}${mcol(1,470)}
      <img src="${spriteURL(hero(S.hero,'down',0),4,'prep'+S.hero)}" style="width:96px;image-rendering:pixelated;position:absolute;right:250px;bottom:30px">
      <div style="position:absolute;right:20px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <button class="bubbtn ${wageTotal()>baseWage()&&wageTotal()>S.money?'locked':''}" id="pGo">장사하기!<br><span style="font-size:12px">Enter</span></button><button class="bubbtn sm" id="pHow" style="transform:rotate(4deg)">게임방법</button></div></div>
  </div>`,true);
  document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); trainScreen(); });
  document.querySelectorAll('[data-lc]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); cycleLook(b.dataset.lc,'c'); });
  document.querySelectorAll('[data-la]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); cycleLook(b.dataset.la,'a'); });
  document.querySelectorAll('.box[data-a]').forEach(b=>b.onclick=()=>{ const a=ALBA.find(x=>x.id===b.dataset.a); if(S.level<a.lv){ SFX.bad(); return; } if(a.base){ SFX.pop(); return; } S.hired[a.id]=!S.hired[a.id]; SFX.pop(); prepScreen(); });
  document.querySelectorAll('.mic').forEach(b=>b.onclick=()=>{ const id=b.dataset.r; if(!S.unlocked.includes(id)){ toast('상점에서 레시피를 먼저 배워요','bad'); SFX.bad(); return; } S.menu[+b.dataset.s]=id; SFX.pop(); prepScreen(); });
  if($('#pTable')) $('#pTable').onclick=()=>{ if(S.money<np){ toast('돈이 모자라요','bad'); SFX.bad(); return; } S.money-=np; S.tables++; writeSave(); SFX.lvl(); toast(`${S.tables}번 테이블을 놓았어요!`,'good'); prepScreen(); };
  $('#pGo').onclick=()=>{ const wage=wageTotal(); if(wage>baseWage()&&wage>S.money){ wageWarn(); return; } writeSave(); startDay(); };
  $('#pStage').onclick=()=>stageScreen(prepScreen);
  $('#pAch').onclick=achScreen;
  $('#pMarket').onclick=()=>{ if(marketDone()){ toast('오늘 장보기는 이미 했어요'); return; } marketScreen(); };
  $('#pHow').onclick=()=>howTo(prepScreen); $('#pShop').onclick=()=>shop('upg'); $('#pNote').onclick=()=>shop('note');
  $('#pTitle').onclick=()=>{ writeSave(); titleScreen(); };
}
function menuDesc(id){ const r=RECIPE(id); if(!r) return ''; const rk=rankOf(id);
  return `<b style="font-size:18px">${r.name}</b> <span class="rank">${rk.k}</span><br>가격: ${won(priceOf(id))}원 · 경험치: +${r.exp} · 판매 ${S.sales[id]||0}개<br><span style="color:#6b5a62">${r.steps.map(s=>s.label).join(' → ')}</span>`; }
function openPause(){
  if(!R) return; R.paused=true; closeMG();
  showModal(`<div class="win mwin" style="width:540px"><div class="wtitle">잠깐 멈춤</div><div class="mbody center">
    <label class="toggle"><input type="checkbox" id="cHelp" ${S.help?'checked':''}> 도움말(다음 할 일·레시피 순서·반짝 표시) 보이기 (H)</label><br>
    <button class="pbtn green" id="bRes">계속하기 (Enter)</button> <button class="pbtn" id="bHow2">게임방법</button><br><br>
    <button class="pbtn small" id="bTitle">처음 화면으로 (오늘 기록은 저장 안 됨)</button></div></div>`);
  $('#cHelp').onchange=e=>{ S.help=e.target.checked; };
  $('#bRes').onclick=()=>{ hideModal(); R.paused=false; cv.focus(); };
  $('#bHow2').onclick=()=>howTo(openPause);
  $('#bTitle').onclick=()=>{ const help=S.help; S=JSON.parse(R.snapshot); S.help=help; writeSave(); titleScreen(); };
}
function endDay(){
  curTrack=null; bgmStop(); fanfare();
  R.paused=true; closeMG(); hold(null);
  updateMissions(); const stars=(R.missions||[]).filter(m=>m.done).length, bonus=stars*1500*(1+S.stage*0.5); S.money+=bonus; S.fame+=stars; S.tot.stars+=stars;
  const st=R.stats, profit=st.sales+st.tips-st.cost-st.wage+bonus, df=S.fame-st.fame0;
  const newRec=recordDay(st), mRow=masterDayEnd(st,stars,newRec.length>0); if(hired('clean')&&alv('clean')>=5) S.fame++;
  S.day++; writeSave();
  dayTotals(st); if(st.bike){ S.fame+=2; S.money+=1000; } const got=checkAch(); writeSave();
  const learned=R.learnedToday.length?R.learnedToday.map(t=>'✔ '+t).join('<br>'):'오늘은 새로 배운 내용이 없어요.';
  showModal(`<div class="win mwin" style="width:1080px"><div class="wtitle">${S.day-1}일차 장부</div><div class="mbody"><div class="sumCols"><div>
    <table class="sum">
      <tr><td>대접한 손님</td><td>${st.served}명</td></tr><tr><td>화나서 간 손님</td><td>${st.angry}명</td></tr>
      <tr><td>음식 판매</td><td>${won(st.sales)}원</td></tr><tr><td>팁</td><td>${won(st.tips)}원</td></tr>
      <tr><td>재료비·비누값</td><td>-${won(st.cost)}원</td></tr><tr><td>알바 일당</td><td>-${won(st.wage)}원</td></tr>
      <tr><td><b>오늘 번 돈</b></td><td style="color:${profit>=0?'#1f7a32':'#c02838'}"><b>${profit>=0?'+':''}${won(profit)}원</b></td></tr>
      <tr><td>식품군 반찬 맞히기</td><td>${st.sides}번</td></tr><tr><td>질문 손님 정답</td><td>${st.quizOK} / ${st.quizN}</td></tr>
      <tr><td>최고 콤보 · 피버</td><td>${st.maxCombo||0}콤보 · ${st.fever||0}번</td></tr>
      <tr><td>명성</td><td>${S.fame} (${df>=0?'+':''}${df})</td></tr>${mRow}${newRec.length?`<tr><td>🏆 새 기록!</td><td>${newRec.join(' · ')}</td></tr>`:''}</table>
    <div class="learn lscroll"><b>오늘 새로 배운 실과 내용</b><br>${learned}</div></div><div>
    <div class="learn" style="background:#fff7d0"><b>오늘의 목표 <span style="color:#ffb830;font-size:18px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span></b> 보상 ${won(bonus)}원 · 명성 +${stars}<br>${(R.missions||[]).map(m=>(m.done?'★ ':'☆ ')+m.label).join('<br>')}</div>
    <div class="learn" style="background:#eaf6ff"><b>🚲 오늘의 식품 구성 자전거</b> ${st.bike?'<b style="color:#1f7a32">완성! 명성 +2 · 1,000원</b>':'손님이 먹은 식품군'}<div class="bikeBig">${bikeChips(true)}</div><span class="dim">유지·당류는 적게 먹는 식품군이라 여기에는 넣지 않았어요.</span></div>
    <div class="learn" style="background:#f0ffe8"><b>가게 등급: ${STAGES[S.stage].n}</b>${STAGES[S.stage+1]?` → 다음 「${STAGES[S.stage+1].n}」${stageBars(S.stage+1)}`:' (최고 등급!)'}</div>
    ${got.length?`<div class="learn" style="background:#fff0f6"><b>🏅 도전 과제 달성!</b><br>${got.map(a=>`${a.n} — ${a.d} <b>(+${won(a.r)}원)</b>`).join('<br>')}</div>`:''}</div></div>
    <div class="center" style="margin-top:8px"><button class="pbtn green" id="bNext">다음 날 준비하기 (Enter)</button></div></div></div>`);
  if(got.length) fanfare();
  $('#bNext').onclick=afterDay;
}
function shop(tab){
  const tabs=`<div class="tabs"><button class="tab ${tab==='upg'?'on':''}" data-t="upg">도구·가게</button><button class="tab ${tab==='rec'?'on':''}" data-t="rec">레시피 배우기</button><button class="tab ${tab==='note'?'on':''}" data-t="note">실과 노트</button></div>`;
  let body='';
  if(tab==='upg') body='<div class="items">'+UPGRADES.map(u=>{ const lv=lvl(u.id), max=u.price.length, own=lv>=max, p=u.price[lv];
    return `<div class="item ${own?'own':''}"><div class="ie">${u.e}</div><div class="it"><b>${u.n}</b>${max>1?` (${lv}/${max})`:''}<br>${u.d}</div>${own?'<b style="color:#2e8a3e">보유</b>':`<button class="pbtn small" data-u="${u.id}" ${S.money<p?'disabled':''}>${won(p)}원</button>`}</div>`; }).join('')+'</div>';
  else if(tab==='rec') body='<div class="items">'+CONTENT.recipes.map(r=>{ const own=S.unlocked.includes(r.id), ok=S.level>=r.unlock.level&&S.money>=r.unlock.money;
    return `<div class="item ${own?'own':''}"><img src="${spriteURL(IC[r.id],3,'m'+r.id)}"><div class="it"><b>${r.name}</b> <span class="rank">${rankOf(r.id).k}</span><br>${won(priceOf(r.id))}원 · 판매 ${S.sales[r.id]||0}개</div>${own?'<b style="color:#2e8a3e">보유</b>':`<button class="pbtn small" data-r="${r.id}" ${ok?'':'disabled'}>Lv.${r.unlock.level}<br>${won(r.unlock.money)}원</button>`}</div>`; }).join('')+'</div>';
  else { const L=ALL_TIPS.filter(t=>S.learned.includes(t)).concat(S.learned.filter(t=>!ALL_TIPS.includes(t)));
    body=`<div style="margin-bottom:6px">모은 실과 노트: ${L.length}개</div><ol class="noteList">${L.map(t=>`<li>${t}</li>`).join('')||'<li>아직 없어요</li>'}</ol>`; }
  showModal(`<div class="win mwin"><div class="wtitle">상점 · ${won(S.money)}원 · Lv.${S.level}</div><div class="mbody">${tabs}${body}
    <div class="center" style="margin-top:10px"><button class="pbtn" id="bBackS">준비 화면으로</button></div></div></div>`);
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>shop(b.dataset.t));
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{ const u=UPGRADES.find(x=>x.id===b.dataset.u), lv=lvl(u.id), p=u.price[lv]; if(S.money<p) return; S.money-=p; S.upg[u.id]=lv+1; if(u.id==='vending') S.vend={k:['water','milk','juice'],n:VEND_MAX}; writeSave(); SFX.coin(); shop('upg'); });
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ const r=RECIPE(b.dataset.r); if(S.money<r.unlock.money||S.level<r.unlock.level) return; S.money-=r.unlock.money; S.unlocked.push(r.id); writeSave(); SFX.lvl(); shop('rec'); });
  $('#bBackS').onclick=prepScreen;
}

/* ===================== 시작 ===================== */
function boot(){
  drawBG(); fit();
  $('#icCoin').src=spriteURL(IC.coin,2); $('#icStar').src=spriteURL(IC.star,2); $('#icGuest').src=spriteURL(animal('rabbit','#ff9ec7',0),1);
  $('#btnMusic').textContent=musicOn?'♪ 켬':'♪ 끔';
  const unlock=()=>{ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} if(musicOn&&!BGM) bgmStart(); };
  addEventListener('pointerdown',unlock); addEventListener('keydown',unlock);
  S=defaultSave(); newRun(); R.paused=true; titleScreen(); requestAnimationFrame(loop);
}
Promise.all([document.fonts.load('12px Galmuri'),document.fonts.load('10px Galmuri9'),document.fonts.load('8px Galmuri7')]).then(boot,boot);
</script>
</body>
